name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check public repository boundaries
        run: python scripts/check_public_files.py
      - name: Run unit and local HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Run customer scenarios
        run: python scripts/check_scenarios.py
      - name: Check shell scripts
        run: bash -n scripts/*.sh
      - name: Check Ruby demo helper
        run: ruby -c scripts/create_local_demo.rb
      - name: Validate Compose configuration with temporary secrets
        run: |
          python scripts/setup.py
          docker compose config --quiet
