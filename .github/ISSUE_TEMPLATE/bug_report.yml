name: Bug report
description: Report a reproducible product or deployment problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Use synthetic examples and redact secrets. Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected behavior and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python and Docker versions, repository commit, FAQ or Ollama mode. Do not paste .env.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or test results
