x-chatwoot: &chatwoot
  image: ${CHATWOOT_IMAGE:-chatwoot/chatwoot:v4.20.1}
  env_file: .env
  volumes:
    - storage:/app/storage
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  rails:
    <<: *chatwoot
    entrypoint: docker/entrypoints/rails.sh
    command: [bundle, exec, rails, s, -p, '3000', -b, 0.0.0.0]
    ports: ['127.0.0.1:3000:3000']
  sidekiq:
    <<: *chatwoot
    # Local demo: allow the worker to call the bot on the private Compose network.
    environment:
      SAFE_FETCH_ALLOW_PRIVATE_NETWORK: 'true'
    command: [bundle, exec, sidekiq, -C, config/sidekiq.yml]
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: chatwoot_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/setup.py}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d chatwoot_production']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run python3 scripts/setup.py}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis:/data]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:8025:8025']
    restart: unless-stopped
  bot:
    build: ./bot
    env_file: .env
    volumes:
      - ./knowledge:/app/knowledge:ro
      - ./data:/app/data
    ports: ['127.0.0.1:8080:8080']
    extra_hosts: ['host.docker.internal:host-gateway']
    restart: unless-stopped

volumes:
  storage:
  postgres:
  redis:
